<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Agenda da clínica</title>
  <link rel="stylesheet" href="/css/style.css">
</head>
<body>
  <main class="container">
    <header>
      <div>
        <p class="eyebrow">agenda-sincronizada</p>
        <h1>Agenda da clínica</h1>
        <p class="muted">Gerencie os agendamentos da clínica.</p>
      </div>

      <div class="toolbar">
        <button type="button" id="logoutButton" class="secondary">
          Sair
        </button>
      </div>
    </header>

    <section class="toolbar card">
      <label for="professionalId">
        Profissional
        <select id="professionalId" required>
          <option value="">Carregando profissionais...</option>
        </select>
      </label>

      <label for="date">
        Data
        <input id="date" type="date">
      </label>

      <button id="loadButton" type="button">Carregar agenda</button>
    </section>

    <section class="card">
      <div class="section-heading">
        <h2>Agendamentos</h2>
        <button id="newButton" type="button" class="secondary">
          Novo agendamento
        </button>
      </div>

      <p id="message" class="muted">
        Carregue a agenda para começar.
      </p>

      <div id="appointments" class="appointments"></div>
    </section>
   
    <dialog id="appointmentDialog">
      <form id="appointmentForm">
        <h2 id="dialogTitle">Novo compromisso</h2>

        <label for="patientName">
          Paciente
          <input
            id="patientName"
            name="patientName"
            maxlength="150"
            required
          >
        </label>

        <label for="title">
          Descrição
          <input
            id="title"
            name="title"
            value="Consulta"
            maxlength="150"
            required
          >
        </label>

        <label for="appointmentProfessionalId">
          Profissional
          <select
            id="appointmentProfessionalId"
            name="professionalId"
            required
          ></select>
        </label>

        <label for="startAt">
          Início
          <input
            id="startAt"
            name="startAt"
            type="datetime-local"
            required
          >
        </label>

        <label for="endAt">
          Fim
          <input
            id="endAt"
            name="endAt"
            type="datetime-local"
            required
          >
        </label>

        <p id="formMessage" class="muted" role="alert"></p>

        <div class="actions">
          <button
            type="button"
            id="closeDialog"
            class="secondary"
          >
            Voltar
          </button>

          <button type="submit" id="saveButton">
            Salvar
          </button>
        </div>
      </form>
    </dialog>

  </main>
  <script src="/js/utils/agenda-utils.js" defer></script>
  <script src="/js/agenda.js" defer></script>
  <script src="/js/agenda-auth.js" defer></script>
</body>
</html>
