services:
  postgres:
    image: postgres:17-alpine
    container_name: agenda-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: agenda
      POSTGRES_USER: clinica
      POSTGRES_PASSWORD: clinica_senha
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U clinica -d agenda"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:8-alpine
    container_name: agenda-redis
    ports:
      - "127.0.0.1:6379:6379"
    command: redis-server --appendonly yes
    volumes:
      - redis_data:/data
    restart: unless-stopped

volumes:
  postgres_data:
  redis_data:
