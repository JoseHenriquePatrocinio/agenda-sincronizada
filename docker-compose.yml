services:
  postgres:
    image: postgres:17-alpine
    container_name: agenda-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: agenda
      POSTGRES_USER: clinica
      POSTGRES_PASSWORD: clinica_senha
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U clinica -d agenda"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  postgres_data:
